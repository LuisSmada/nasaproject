name: NASA Project CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  build:
    runs-on: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js version 22
        uses: actions/setup-node@v3
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build --prefix client
